name: th_folder_sidebar
description: A reusable Flutter package providing a hierarchical folder sidebar with file navigation, lazy loading, and customizable file operations.
version: 1.0.0

publish_to: 'none' # Private package

environment:
  sdk: ^3.8.1
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter
  
  # Core dependencies for folder sidebar functionality
  file_picker: ^8.0.0+1
  path: ^1.8.3
  path_provider: ^2.1.1
  desktop_drop: ^0.6.1
  
  # Optional state management support (can be configured by consumer)
  flutter_riverpod: ^2.4.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true